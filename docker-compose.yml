version: "3.8"  # Updated from version 2 to support modern healthcheck conditions

services:
  fast-api:
    build: .
    ports:
      - "8000:8000"  
    environment:
      - MONGO_URL=${MONGO_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ALGO=${JWT_ALGO}
    volumes:
      - .:/usr/src/app  
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - my-mongo-network

  mongo:  # Aligned perfectly to the left with fast-api
    image: mongo:7.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root  # Fixed missing underscore in MONGO_INITDB
      MONGO_INITDB_ROOT_PASSWORD: example # Fixed missing underscore in MONGO_INITDB
    ports:
      - "27017:27017"
    networks:
      - my-mongo-network  # Removed the trailing colon here
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"] 
      interval: 1m30s  # Lowered interval so you aren't waiting 1.5 minutes for health check
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  my-mongo-network:
    driver: bridge